  <section class="app" id="apps" aria-labelledby="lb-title">
    <div class="app-intro">
      <img class="app-icon" src="/assets/brand/launch-board-icon.svg" width="88" height="88" alt="">
      <h2 id="lb-title">Launch Board</h2>
      <p class="app-line">Mac의 launchd 서비스를 한눈에 보고 제어합니다. 다른 Mac은 건드리지 않고 상태만 확인합니다.</p>
      <ul class="badges" aria-label="릴리스 정보">
        <li><span>최신</span> 0.3.1</li>
        <li>macOS 14+</li>
        <li>오픈소스</li>
        <li>수집 데이터 없음</li>
      </ul>
      <a class="btn" href="/ko/launch-board/">Launch Board 살펴보기</a>
    </div>

    <figure class="showcase">
      <div class="float">
        <div class="shot">
          <div class="window" aria-hidden="true">
            <div class="win-titlebar">
              <div class="traffic"><i></i><i></i><i></i></div>
              <div class="win-title">Launch Board <span>이 Mac</span></div>
              <div class="win-tools">
                <div class="win-seg"><b>내 LaunchAgents</b><span>시스템</span></div>
                <div class="win-search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4L14 14"/></svg>서비스 검색</div>
              </div>
            </div>
            <div class="win-body">
              <div class="win-side">
                <h4>내 서비스</h4>
                <ul>
                  <li class="is-active">전체 서비스 <em>9</em></li>
                  <li>즐겨찾기 <em>2</em></li>
                  <li>주의 필요 <em>1</em></li>
                </ul>
                <h4>그룹</h4>
                <ul>
                  <li><span class="sw" style="background:#FF5C33"></span>개발 서버 <em>4</em></li>
                  <li><span class="sw" style="background:#5B8DEF"></span>백업 <em>2</em></li>
                  <li><span class="sw" style="background:#9AA3B2"></span>미디어 <em>3</em></li>
                </ul>
                <h4>서버</h4>
                <ul>
                  <li><span class="host"></span>이 Mac</li>
                  <li><span class="host"></span>studio-mac <span class="ro">조회 전용</span></li>
                  <li><span class="host is-off"></span>build-mini <span class="ro">오프라인</span></li>
                </ul>
              </div>
              <div class="win-main">
                <div class="win-main-head">
                  <strong>전체 서비스</strong><span>9</span>
                  <span class="chip is-on">전체</span><span class="chip">실행 중</span><span class="chip">실패</span>
                </div>
                <table class="svc">
                  <thead><tr><th>실행</th><th>서비스</th><th>건강</th><th class="num">CPU</th><th class="num col-wide">RSS</th><th class="num col-wide">TCP 포트</th></tr></thead>
                  <tbody>
<tr class="is-selected"><td><span class="badge run">실행 중</span></td><td class="label"><span class="star">★</span>dev.example.api</td><td><span class="badge unk">미확인</span></td><td class="num">2.1%</td><td class="num col-wide">142 MB</td><td class="num col-wide">8080</td></tr>
<tr><td><span class="badge run">실행 중</span></td><td class="label"><span class="star">★</span>com.example.backup</td><td><span class="badge unk">미확인</span></td><td class="num">0.3%</td><td class="num col-wide">38 MB</td><td class="num col-wide dim">-</td></tr>
<tr><td><span class="badge run">실행 중</span></td><td class="label">dev.example.worker</td><td><span class="badge unk">미확인</span></td><td class="num">6.8%</td><td class="num col-wide">210 MB</td><td class="num col-wide dim">-</td></tr>
<tr><td><span class="badge run">실행 중</span></td><td class="label">com.example.cache</td><td><span class="badge unk">미확인</span></td><td class="num">1.2%</td><td class="num col-wide">96 MB</td><td class="num col-wide">6380</td></tr>
<tr><td><span class="badge fail">실패 78</span></td><td class="label">com.example.thumbnailer</td><td><span class="badge na">-</span></td><td class="num dim">-</td><td class="num col-wide dim">-</td><td class="num col-wide dim">-</td></tr>
<tr><td><span class="badge wait">대기</span></td><td class="label">com.example.media-sync</td><td><span class="badge na">-</span></td><td class="num dim">-</td><td class="num col-wide dim">-</td><td class="num col-wide dim">-</td></tr>
<tr><td><span class="badge run">실행 중</span></td><td class="label">dev.example.docs</td><td><span class="badge unk">미확인</span></td><td class="num">0.1%</td><td class="num col-wide">24 MB</td><td class="num col-wide">4000</td></tr>
<tr><td><span class="badge wait">대기</span></td><td class="label">com.example.ingest-watch</td><td><span class="badge na">-</span></td><td class="num dim">-</td><td class="num col-wide dim">-</td><td class="num col-wide dim">-</td></tr>
<tr><td><span class="badge run">실행 중</span></td><td class="label">dev.example.preview</td><td><span class="badge unk">미확인</span></td><td class="num">0.0%</td><td class="num col-wide">18 MB</td><td class="num col-wide">5173</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="win-detail">
                <div>
                  <div class="d-label">dev.example.api</div>
                  <div class="d-badges"><span class="badge run">실행 중</span><span class="badge unk">미확인</span></div>
                </div>
                <dl>
                  <dt>종류</dt><dd>사용자 LaunchAgent</dd>
                  <dt>파일</dt><dd><code>~/Library/LaunchAgents/dev.example.api.plist</code></dd>
                  <dt>PID</dt><dd>4123</dd>
                  <dt>건강</dt><dd>미확인, 아직 건강 확인 기능 없음</dd>
                  <dt>수신 포트</dt><dd>TCP 8080</dd>
                </dl>
                <div class="d-graph">
                  <h5>CPU, 최근 1시간 <b>2.1%</b></h5>
                  <svg viewBox="0 0 100 30" preserveAspectRatio="none"><line class="base" x1="0" y1="29.5" x2="100" y2="29.5"/><polygon class="area" points="0,30 0,22 8,20 16,23 24,18 32,21 40,12 48,19 56,22 64,17 72,20 80,9 88,16 100,14 100,30"/><polyline class="line" points="0,22 8,20 16,23 24,18 32,21 40,12 48,19 56,22 64,17 72,20 80,9 88,16 100,14"/></svg>
                </div>
                <div class="d-graph">
                  <h5>메모리 (RSS) <b>142 MB</b></h5>
                  <svg viewBox="0 0 100 30" preserveAspectRatio="none"><line class="base" x1="0" y1="29.5" x2="100" y2="29.5"/><polygon class="area alt" points="0,30 0,19 10,18.5 20,18 30,17.5 40,17 50,16 60,16 70,15 80,14.5 90,14 100,13 100,30"/><polyline class="line alt" points="0,19 10,18.5 20,18 30,17.5 40,17 50,16 60,16 70,15 80,14.5 90,14 100,13"/></svg>
                </div>
                <div class="d-actions"><span class="is-dim">시작</span><span>재시작</span><span>중지</span></div>
                <p class="d-note">실행할 때마다 먼저 확인합니다.</p>
              </div>
            </div>
            <div class="win-status"><span>서비스 9개</span><span>주의 필요 1개</span><span>3초 전 갱신</span></div>
          </div>
        </div>
      </div>
      <figcaption>다른 Mac 두 대를 추가한 Launch Board 화면입니다. 여기 나오는 label과 기기 이름은 모두 예시입니다.</figcaption>
      <p class="visually-hidden">창에는 예시 서비스 9개가 실행 상태, 건강 상태, CPU, 메모리, TCP 포트와 함께 나열됩니다. 선택한 서비스 dev.example.api의 상세 패널에는 plist 파일, PID, 수신 포트, CPU와 메모리 이력, 시작·재시작·중지 버튼이 있습니다.</p>
    </figure>
